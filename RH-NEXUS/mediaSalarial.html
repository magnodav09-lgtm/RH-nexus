    <main class="container py-5">
      <div class="mb-4">
        <span class="section-kicker">Problema 5</span>
        <h1 class="fw-bold">Média salarial</h1>
        <p class="text-secondary">Informe cinco salários e calcule a média.</p>
      </div>
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <form id="form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Salário 1</label
                    ><input
                      id="sal1"
                      type="number"
                      min="0.01"
                      step="0.01"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Salário 2</label
                    ><input
                      id="sal2"
                      type="number"
                      min="0.01"
                      step="0.01"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Salário 3</label
                    ><input
                      id="sal3"
                      type="number"
                      min="0.01"
                      step="0.01"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Salário 4</label
                    ><input
                      id="sal4"
                      type="number"
                      min="0.01"
                      step="0.01"
                      class="form-control"
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Salário 5</label
                    ><input
                      id="sal5"
                      type="number"
                      min="0.01"
                      step="0.01"
                      class="form-control"
                    />
                  </div>
                </div>
                <button class="btn btn-primary w-100 mt-4">
                  Calcular média
                </button>
                <div id="erro" class="alert alert-danger d-none mt-3"></div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div id="resultado" class="result-card h-100">
            O resultado aparecerá aqui.
          </div>
        </div>
      </div>
